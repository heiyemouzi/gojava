version: "3.8"

# 本地一键起依赖。生产用 K8s，这里只是开发期。
# 启动：cd deploy && docker compose up -d
# 停：  docker compose down

services:

  mysql:
    image: mysql:8.0
    container_name: gojava-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: gojava
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ../scripts/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot123"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: gojava-redis
    ports:
      - "6379:6379"

  nacos:
    image: nacos/nacos-server:v2.3.0
    container_name: gojava-nacos
    environment:
      MODE: standalone
    ports:
      - "8848:8848"
      - "9848:9848"

  minio:
    image: minio/minio:latest
    container_name: gojava-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"

  # 重型依赖按需打开：
  # elasticsearch:
  #   image: docker.elastic.co/elasticsearch/elasticsearch:8.13.0
  #   environment:
  #     - discovery.type=single-node
  #     - xpack.security.enabled=false
  #   ports: ["9200:9200"]

  # rocketmq-namesrv:
  #   image: apache/rocketmq:5.1.4
  #   command: sh mqnamesrv
  #   ports: ["9876:9876"]

volumes:
  mysql-data:
