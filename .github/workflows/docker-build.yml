name: Build and Push Docker Images

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package -DskipTests

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push auth-center
        uses: docker/build-push-action@v5
        with:
          context: ./biz-java/auth-center
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/auth-center:latest

      - name: Build and push tenant-service
        uses: docker/build-push-action@v5
        with:
          context: ./biz-java/tenant-service
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tenant-service:latest

      - name: Build and push product-service
        uses: docker/build-push-action@v5
        with:
          context: ./biz-java/product-service
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/product-service:latest

      - name: Build and push order-service
        uses: docker/build-push-action@v5
        with:
          context: ./biz-java/order-service
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/order-service:latest
